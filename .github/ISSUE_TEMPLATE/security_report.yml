name: Security vulnerability report
description: Report a security issue privately
title: '[Security]: '
labels: ['security']
body:
  - type: markdown
    attributes:
      value: |
        **Do not disclose security vulnerabilities publicly.**

        Please report security issues privately so we can coordinate a responsible disclosure:

        - GitHub private vulnerability reporting (preferred): https://github.com/fells-code/seamless-auth-api/security/advisories/new
        - Email: security@seamlessauth.com
          Subject: Security Issue: seamless-auth-api

        See [SECURITY.md](https://github.com/fells-code/seamless-auth-api/blob/main/SECURITY.md) for details.

        This issue will be closed without discussion.
