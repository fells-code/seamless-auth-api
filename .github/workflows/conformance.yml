# Run the cross-repo conformance matrix on PRs, testing this repo's change against
# the rest of the ecosystem. The reusable workflow lives in seamless-cli.
name: conformance

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: fells-code/seamless-cli/.github/workflows/verify-conformance.yml@68d33002037d1dbc18f6f0ce4df7a3a91827245b # v0.30.1
    with:
      api-ref: ${{ github.event.pull_request.head.sha }}
