# Run the cross-repo conformance matrix on PRs, testing this repo's change against
# the rest of the ecosystem. The reusable workflow lives in seamless-cli.
name: conformance

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: fells-code/seamless-cli/.github/workflows/verify-conformance.yml@28a363fcd6ba6c2ea3930c7172093638d8c41fe2 # v0.27.2
    with:
      api-ref: ${{ github.event.pull_request.head.sha }}
