# Run the cross-repo conformance matrix on PRs, testing this repo's change against
# the rest of the ecosystem. The reusable workflow lives in seamless-cli.
name: conformance

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: fells-code/seamless-cli/.github/workflows/verify-conformance.yml@e0dc559550168c53721efa1a0194d7f637f3e18b # v0.28.0
    with:
      api-ref: ${{ github.event.pull_request.head.sha }}
