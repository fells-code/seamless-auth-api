name: CI

on:
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails on a new high or critical in anything that ships. Two moderates
      # remain from sequelize, whose only offered fix is a downgrade to v3, so
      # the gate sits above them rather than being disabled outright.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Development dependencies do not ship, so a finding here is reported
      # rather than blocking. Dependabot opens the pull request that fixes it.
      - name: Audit development dependencies
        run: npm audit --audit-level=high || true

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run Tests with Coverage
        run: CI=true npm run coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run type checks
        run: npm run typecheck
      - name: Build
        run: npm run build
