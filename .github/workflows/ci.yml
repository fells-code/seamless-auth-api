name: CI

on:
  pull_request:
    branches: ['**']

jobs:
  # A pull request only ever runs ci.yml and codeql.yml, so a mistake in
  # release.yml or docker-publish.yml reaches main unchallenged and is not
  # noticed until a release goes quiet. This is the one check that reads those
  # files on every pull request.
  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest

    env:
      # Pinned by version and checksum rather than installed by the upstream
      # download script, which curls an unpinned ref into bash. Dependabot does
      # not track either form, so this pair is bumped by hand.
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          set -euo pipefail
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "${ARCHIVE}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ARCHIVE}"
          echo "${ACTIONLINT_SHA256}  ${ARCHIVE}" | sha256sum -c -
          tar -xzf "${ARCHIVE}" actionlint

      # shellcheck is preinstalled on the runner, so this also covers the shell
      # in every run: block.
      - name: Lint workflow files
        run: ./actionlint -color

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails on a new high or critical in anything that ships. Two moderates
      # remain from sequelize, whose only offered fix is a downgrade to v3, so
      # the gate sits above them rather than being disabled outright.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Development dependencies do not ship, so a finding here is reported
      # rather than blocking. Dependabot opens the pull request that fixes it.
      - name: Audit development dependencies
        run: npm audit --audit-level=high || true

      # The package is pre-1.0. A major changeset would release 1.0.0 as a side
      # effect of landing a breaking change rather than as a decision.
      - name: Check changeset bump level
        run: npm run check:changeset-bump

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run Tests with Coverage
        run: CI=true npm run coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run type checks
        run: npm run typecheck
      - name: Build
        run: npm run build
