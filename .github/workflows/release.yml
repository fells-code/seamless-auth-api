name: Version Changelog PR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-changelog:
    if: github.repository == 'fells-code/seamless-auth-api'
    name: Create Version and Changelog PR
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
      version: ${{ steps.tag.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm run test:run

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Create or update version and changelog PR
        id: changesets
        uses: changesets/action@v2
        with:
          # v2 renamed every one of these. Unknown inputs are ignored rather than
          # rejected, so the old names would have left the version PR titled
          # "Version Packages", which commitlint rejects.
          version-script: npm run version-packages
          pr-title: 'chore: update version and changelog'
          commit-message: 'chore: update version and changelog'
          # v2 no longer reads GITHUB_TOKEN from the environment.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Once the version PR is merged there are no changesets left, so the
      # version in package.json is the one to release. Tag it (idempotently) so
      # a versioned image is published. The tag is created here rather than
      # relying on the tag-push event because pushes made with GITHUB_TOKEN do
      # not trigger other workflows; the image build is invoked directly below.
      - name: Tag release
        id: tag
        # Renamed from hasChangesets in changesets/action v2. The old name reads as
        # empty, never equals 'false', and would silently stop every release here.
        # Index syntax because the new name is hyphenated.
        if: steps.changesets.outputs['has-changesets'] == 'false'
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; nothing to release."
            echo "new_tag=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "${TAG}"
            echo "new_tag=true" >> "$GITHUB_OUTPUT"
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      # Publish a GitHub Release for the freshly created tag, using the notes
      # changesets already wrote to CHANGELOG.md so the release body matches the
      # changelog rather than a raw commit list.
      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          awk -v header="## ${VERSION}" '
            $0 == header { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release create "${TAG}" --title "${TAG}" --notes-file release-notes.md
          else
            echo "No CHANGELOG section for ${VERSION}; using generated notes."
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi

  publish-image:
    name: Publish versioned image
    needs: version-changelog
    if: needs.version-changelog.outputs.new_tag == 'true'
    # A called workflow cannot be granted more than the caller holds, so this
    # has to match docker-publish.yml's own permissions block: id-token for
    # keyless cosign signing, security-events for the SARIF upload.
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      image_tag: ${{ needs.version-changelog.outputs.version }}
