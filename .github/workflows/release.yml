name: Version Changelog PR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-changelog:
    if: github.repository == 'fells-code/seamless-auth-api'
    name: Create Version and Changelog PR
    runs-on: ubuntu-latest
    env:
      HUSKY: 0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.10.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Create or update version and changelog PR
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          title: 'chore: update version and changelog'
          commit: 'chore: update version and changelog'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
